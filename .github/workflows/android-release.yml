name: Build signed Android release
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Increasing Play Store version code"
        required: true
        type: number
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      RELEASE_CONFIG: ${{ secrets.MOBILE_PRODUCTION_CONFIG }}
      UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEY_BASE64 }}
      UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.6"
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Prepare private signing and public configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_CONFIG" && test -n "$UPLOAD_KEY" && test -n "$UPLOAD_PASSWORD"
          printf '%s' "$RELEASE_CONFIG" > env/prod.json
          printf '%s' "$UPLOAD_KEY" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=upload\n' "$RUNNER_TEMP/upload-keystore.jks" "$UPLOAD_PASSWORD" "$UPLOAD_PASSWORD" > android/key.properties
      - run: dart run tool/validate_release_config.dart env/prod.json
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols --build-number="$BUILD_NUMBER" --dart-define-from-file=env/prod.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-${{ inputs.build_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols/
          retention-days: 14
      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f android/key.properties env/prod.json "$RUNNER_TEMP/upload-keystore.jks"
